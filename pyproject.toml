[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-llamacpp-proxy"
version = "0.1.0"
description = "Responses API to llama.cpp Chat Completions proxy for Codex Desktop."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "codex-llamacpp-proxy contributors" },
]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "ruff>=0.14",
]

[project.scripts]
codex-llamacpp-proxy = "codex_llamacpp_proxy.proxy:main"

[tool.pytest.ini_options]
addopts = "--cov=codex_llamacpp_proxy"
pythonpath = ["src"]
testpaths = ["tests"]
